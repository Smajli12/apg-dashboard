<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdPulse Guard Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            darkcard: '#2a2a3b',
            darkbg: '#1e1e2f'
          }
        }
      }
    };
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-white font-sans min-h-screen">

  <!-- LOADER -->
  <div id="loadingIndicator" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-white dark:bg-darkbg text-gray-500 dark:text-gray-400">
    <svg class="animate-spin h-6 w-6 text-blue-500 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    <span>Loading dashboard data…</span>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardContent" class="max-w-6xl mx-auto py-8 px-4 opacity-0 transition-opacity duration-500 pointer-events-none">

    <!-- TOP BAR -->
    <div class="flex justify-between mb-4 items-center gap-4 flex-wrap">
      <div class="flex flex-wrap items-center gap-2">
        <label class="text-sm">Date:</label>
        <input type="date" id="dateFilter" class="px-2 py-1 border rounded-md dark:bg-darkcard" />
        <button id="clearDate" class="text-sm text-blue-600">Clear</button>

        <label class="ml-4 text-sm">Client:</label>
        <select id="clientFilter" class="px-2 py-1 border rounded-md dark:bg-darkcard">
          <option value="">All Clients</option>
        </select>
      </div>

      <button id="darkModeBtn" class="px-3 py-1 rounded-full bg-gray-200 dark:bg-gray-700 text-sm">
        🌓 <span id="modeLabel">Dark Mode</span>
      </button>
    </div>

    <h1 id="dashboardTitle" class="text-4xl font-extrabold text-center mb-8">
      AdPulse Guard – Overall Summary
    </h1>

    <!-- STATS -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="bg-white dark:bg-darkcard p-6 rounded-2xl text-center">
        <div id="issueCount" class="text-3xl font-bold">0</div>
        <div class="text-sm">Issue Types</div>
      </div>
      <div class="bg-white dark:bg-darkcard p-6 rounded-2xl text-center">
        <div id="slotCount" class="text-3xl font-bold">0</div>
        <div class="text-sm">Total Slots</div>
      </div>
      <div class="bg-white dark:bg-darkcard p-6 rounded-2xl text-center">
        <div id="dailyLoss" class="text-3xl font-bold text-red-600">$0.00</div>
        <div class="text-sm">Daily Loss</div>
      </div>
    </div>

    <!-- CHARTS -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <div class="bg-white dark:bg-darkcard p-4 rounded-2xl">
        <canvas id="issueChart"></canvas>
      </div>
      <div class="bg-white dark:bg-darkcard p-4 rounded-2xl">
        <canvas id="severityChart"></canvas>
      </div>
      <div class="bg-white dark:bg-darkcard p-4 rounded-2xl md:col-span-2">
        <canvas id="lossTrendChart"></canvas>
      </div>
    </div>

    <p class="text-xs text-right mt-6">
      Last updated: <span id="lastUpdated">–</span>
    </p>
  </div>

  <!-- SCRIPT -->
  <script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx-PFUcYyEXUR7Thw8kqzAWpCX74XY-4c-Si9myS69jloI9Vir_5YaZLXGCUiUquxMn/exec';

    let firstRender = true;
    let issueChart, severityChart, lossTrendChart;

    fetch(SHEET_URL)
      .then(r => r.json())
      .then(({ data = [] }) => {
        updateDashboard(data);
      });

    function updateDashboard(rows) {
      // minimal demo logic
      document.getElementById('issueCount').textContent = rows.length;
      document.getElementById('slotCount').textContent = rows.length;
      document.getElementById('dailyLoss').textContent = '$' + (rows.length * 10).toFixed(2);
      document.getElementById('lastUpdated').textContent = new Date().toLocaleString();

      if (firstRender) {
        document.getElementById('loadingIndicator').remove();
        const dash = document.getElementById('dashboardContent');
        dash.classList.remove('opacity-0', 'pointer-events-none');
        firstRender = false;
      }
    }
  </script>
</body>
</html>
