<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Alert Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            darkcard: '#2a2a3b',
            darkbg: '#1e1e2f'
          }
        }
      }
    };
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-white font-sans min-h-screen">

<!-- LOADER -->
<div id="loadingIndicator" class="fixed inset-0 z-50 flex items-center justify-center bg-white/70 dark:bg-darkbg/70 text-sm text-gray-500">
  <div class="flex flex-col items-center">
    <svg class="animate-spin h-6 w-6 text-blue-500 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    Loading dashboard…
  </div>
</div>

<!-- HEADER -->
<header class="bg-white dark:bg-darkcard shadow-sm">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <h1 class="text-sm font-semibold tracking-wide">
      AdPulse Guard
    </h1>

    <div class="flex items-center gap-2 text-xs">
      <input type="date" id="dateFilter" class="px-2 py-1 border rounded dark:bg-darkcard">
      <span class="text-gray-400">to</span>
      <select id="clientFilter" class="px-2 py-1 border rounded dark:bg-darkcard">
        <option value="">All Clients</option>
      </select>
      <button id="clearDate" class="text-blue-600 hover:underline">Clear</button>
      <button id="darkModeBtn" class="ml-2 px-3 py-1 rounded bg-gray-200 dark:bg-gray-700">
        <span id="modeLabel">Dark Mode</span>
      </button>
    </div>
  </div>
</header>

<div id="dashboardContent" class="max-w-6xl mx-auto py-8 px-4">

  <!-- TOP OFFENDER -->
  <div id="topOffenderBox" class="hidden bg-white dark:bg-darkcard rounded-xl shadow p-6 mb-6">
    <h2 class="text-sm font-semibold uppercase tracking-wide mb-3">Top Offender Slot</h2>
    <p><strong>Slot:</strong> <span id="offenderSlot"></span></p>
    <p><strong>Loss:</strong> <span id="offenderLoss"></span></p>
    <p><strong>Page:</strong> <span id="offenderPage"></span></p>
    <p><strong>Issue:</strong> <span id="offenderIssue"></span></p>
  </div>

  <!-- KPI -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-6 text-center">
      <div class="text-xs uppercase tracking-wide text-gray-500 mb-1">Issue Types</div>
      <div id="issueCount" class="text-3xl font-bold">—</div>
    </div>
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-6 text-center">
      <div class="text-xs uppercase tracking-wide text-gray-500 mb-1">Total Slots</div>
      <div id="slotCount" class="text-3xl font-bold">—</div>
    </div>
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-6 text-center">
      <div class="text-xs uppercase tracking-wide text-gray-500 mb-1">Daily Loss</div>
      <div id="dailyLoss" class="text-3xl font-bold text-red-600">$—</div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-4">
      <h2 class="text-xs uppercase tracking-wide text-gray-500 mb-2">Issue Types</h2>
      <div class="h-64">
  <canvas id="issueChart"></canvas>
</div>
    </div>

    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-4">
      <h2 class="text-xs uppercase tracking-wide text-gray-500 mb-2">Severity Breakdown</h2>
      <div class="h-64">
  <canvas id="severityChart"></canvas>
</div>
    </div>

    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-4 md:col-span-2">
      <h2 class="text-xs uppercase tracking-wide text-gray-500 mb-2">Daily Revenue Loss</h2>
      <div class="h-64">
  <canvas id="lossTrendChart"></canvas>
    </div>
  </div>

  <p class="text-xs text-gray-400 mt-6 text-right">
    Last updated: <span id="lastUpdated">—</span>
  </p>
</div>

<script>
Chart.register(ChartDataLabels);
const issueChartEl = document.getElementById('issueChart');
const severityChartEl = document.getElementById('severityChart');
const lossTrendChartEl = document.getElementById('lossTrendChart');
  
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx-PFUcYyEXUR7Thw8kqzAWpCX74XY-4c-Si9myS69jloI9Vir_5YaZLXGCUiUquxMn/exec';
const CACHE_KEY = 'apg_cache';
const CACHE_TTL = 5 * 60 * 1000;

const labelMap = {
  gpt_not_loaded: 'GPT not loaded',
  wrong_network: 'Wrong network',
  slot_not_registered: 'DOM slot not in GPT',
  defined_without_dom: 'GPT slot without DOM',
  unexpected_size: 'Unexpected size',
  empty_response: 'Empty response'
};

let issueChart, severityChart, lossTrendChart;
let allRows = [];

const dateInput = document.getElementById('dateFilter');
const clientFilter = document.getElementById('clientFilter');
const clearDate = document.getElementById('clearDate');

function renderDashboard(rows, selectedDate = null, selectedClient = '') {
  const issueTypes = {}, severities = {}, dailyTotals = {};
  let totalSlots = 0, totalLoss = 0;
  let topSlot = null, topLoss = 0;

  rows.forEach(r => {
    if (!r.issueType) return;

    const dateKey = r.receivedAt.split('T')[0];
    if (selectedDate && dateKey !== selectedDate) return;
    if (selectedClient && r.clientId !== selectedClient) return;

    const loss = Number(r.estimatedDailyRevenueRisk) || 0;
    const type = labelMap[r.issueType] || r.issueType;
    const sev = r.severity || 'unknown';

    issueTypes[type] = (issueTypes[type] || 0) + 1;
    severities[sev] = (severities[sev] || 0) + 1;
    dailyTotals[dateKey] = (dailyTotals[dateKey] || 0) + loss;

    totalSlots++;
    totalLoss += loss;

    if (loss > topLoss) {
      topLoss = loss;
      topSlot = r;
    }
  });

  document.getElementById('issueCount').textContent = Object.keys(issueTypes).length;
  document.getElementById('slotCount').textContent = totalSlots;
  document.getElementById('dailyLoss').textContent =
    `$${totalLoss.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;

  if (Object.keys(issueTypes).length === 0 && selectedDate) {
    confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
  }

  const box = document.getElementById('topOffenderBox');
  if (topSlot) {
    box.classList.remove('hidden');
    document.getElementById('offenderSlot').textContent = topSlot.slotId;
    document.getElementById('offenderLoss').textContent =
      `$${topLoss.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
    document.getElementById('offenderPage').innerHTML =
      `<a href="${topSlot.pageUrl}" target="_blank" class="text-blue-600 underline break-all">${topSlot.pageUrl}</a>`;
    document.getElementById('offenderIssue').textContent =
      labelMap[topSlot.issueType] || topSlot.issueType;
  } else {
    box.classList.add('hidden');
  }

  issueChart?.destroy();
  issueChart = new Chart(issueChartEl, {
    type: 'bar',
    data: { labels: Object.keys(issueTypes), datasets: [{ data: Object.values(issueTypes), backgroundColor: '#3b82f6' }] },
    options: { maintainAspectRatio: false }
  });

  severityChart?.destroy();
  severityChart = new Chart(severityChartEl, {
    type: 'pie',
    data: {
      labels: Object.keys(severities),
      datasets: [{
        data: Object.values(severities),
        backgroundColor: ['#dc2626','#f59e0b','#16a34a']
      }]
    },
    options: {
      maintainAspectRatio: false,
      plugins: {
        datalabels: {
          color: '#fff',
          font: { weight: 'bold' },
          formatter: (v, ctx) => {
            const t = ctx.dataset.data.reduce((a,b)=>a+b,0);
            return Math.round((v/t)*100) + '%';
          }
        }
      }
    }
  });

  lossTrendChart?.destroy();
  lossTrendChart = new Chart(lossTrendChartEl, {
    type: 'line',
    data: { labels: Object.keys(dailyTotals), datasets: [{ data: Object.values(dailyTotals), borderColor: '#3b82f6', tension: 0.3 }] },
    options: { maintainAspectRatio: false }
  });

  document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
  document.getElementById('loadingIndicator').style.display = 'none';
}

// DARK MODE
const darkModeBtn = document.getElementById('darkModeBtn');
const modeLabel = document.getElementById('modeLabel');
if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
modeLabel.textContent = document.documentElement.classList.contains('dark') ? 'Light Mode' : 'Dark Mode';
darkModeBtn.addEventListener('click', () => {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  modeLabel.textContent = isDark ? 'Light Mode' : 'Dark Mode';
});

// CACHE
const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
if (cached && Date.now() - cached.ts < CACHE_TTL) {
  allRows = cached.data;
  renderDashboard(allRows);
}

fetch(SHEET_URL)
  .then(r => r.json())
  .then(j => {
    allRows = j.data || [];
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: allRows }));
    renderDashboard(allRows, dateInput.value, clientFilter.value);
  })
  .catch(() => {
    document.getElementById('loadingIndicator').style.display = 'none';
  });

dateInput.addEventListener('change', () => renderDashboard(allRows, dateInput.value, clientFilter.value));
clientFilter.addEventListener('change', () => renderDashboard(allRows, dateInput.value, clientFilter.value));
clearDate.addEventListener('click', () => {
  dateInput.value = '';
  renderDashboard(allRows, null, clientFilter.value);
});
</script>

</body>
</html>
