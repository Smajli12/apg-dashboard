<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdPulse Guard Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif']
            },
            colors: {
              darkbg: '#1e1e2f',
              darkcard: '#2a2a3b'
            }
          }
        }
      };
    </script>
    <style>
      .dark-mode {
        background-color: #1e1e2f;
        color: #f3f4f6;
      }

      .dark-mode .card {
        background-color: #2a2a3b;
        color: #f3f4f6;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans transition-colors duration-300">
    <div class="max-w-6xl mx-auto py-8 px-4">
      <!-- Dark Mode Toggle -->
      <div class="flex justify-end mb-4 items-center gap-2">
        <span class="text-sm">🌞</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="darkToggle" class="sr-only peer" />
          <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer dark:bg-gray-600 peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:translate-x-full peer-checked:border-white"></div>
        </label>
        <span class="text-sm">🌙</span>
      </div>

      <h1 class="text-4xl font-extrabold text-center mb-8 tracking-tight">AdPulse Guard – Dashboard</h1>

      <!-- Stats -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="card bg-white rounded-2xl shadow-md p-6 text-center transition hover:shadow-lg">
          <div class="text-3xl font-bold animate-pulse" id="issueCount">0</div>
          <div class="text-sm text-gray-600">Issue Types</div>
        </div>
        <div class="card bg-white rounded-2xl shadow-md p-6 text-center transition hover:shadow-lg">
          <div class="text-3xl font-bold" id="slotCount">0</div>
          <div class="text-sm text-gray-600">Total Slots</div>
        </div>
        <div class="card bg-white rounded-2xl shadow-md p-6 text-center transition hover:shadow-lg">
          <div class="text-3xl font-bold" id="dailyLoss">$0.00</div>
          <div class="text-sm text-gray-600">Daily Loss</div>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="card bg-white rounded-2xl shadow-md p-4">
          <canvas id="issueChart" class="h-64"></canvas>
        </div>
        <div class="card bg-white rounded-2xl shadow-md p-4">
          <canvas id="severityChart" class="h-64"></canvas>
        </div>
      </div>
    </div>

    <script>
      const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx-PFUcYyEXUR7Thw8kqzAWpCX74XY-4c-Si9myS69jloI9Vir_5YaZLXGCUiUquxMn/exec';

      const labelMap = {
        gpt_not_loaded: 'GPT not loaded',
        wrong_network: 'Wrong network configuration',
        slot_not_registered: 'DOM slot not in GPT',
        defined_without_dom: 'GPT slot without DOM',
        unexpected_size: 'Unexpected ad size',
        empty_response: 'Empty ad response'
      };

      fetch(SHEET_URL)
        .then(res => res.json())
        .then(json => {
          const rows = json.data || [];

          const issueTypes = {};
          const severities = {};
          let totalSlots = 0;
          let totalLoss = 0;

          rows.forEach(row => {
            const rawType = row.issueType?.trim() || 'unknown_issue';
            const label = labelMap[rawType] || rawType;
            const severity = row.severity?.trim() || 'unknown';
            const loss = parseFloat(row.estimatedDailyRevenueRisk) || 0;

            issueTypes[label] = (issueTypes[label] || 0) + 1;
            severities[severity] = (severities[severity] || 0) + 1;
            totalSlots += 1;
            totalLoss += loss;
          });

          document.getElementById('issueCount').textContent = Object.keys(issueTypes).length;
          document.getElementById('slotCount').textContent = totalSlots;

          const lossElem = document.getElementById('dailyLoss');
          lossElem.textContent = `$${totalLoss.toFixed(2)}`;
          if (totalLoss > 3000) {
            lossElem.classList.add('text-red-600', 'animate-pulse');
          }

          new Chart(document.getElementById('issueChart'), {
            type: 'bar',
            data: {
              labels: Object.keys(issueTypes),
              datasets: [{
                label: 'Issue Count',
                data: Object.values(issueTypes),
                backgroundColor: '#3b82f6'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (context) => `Count: ${context.parsed.y}`
                  }
                }
              },
              scales: {
                y: { beginAtZero: true }
              }
            }
          });

          new Chart(document.getElementById('severityChart'), {
            type: 'pie',
            data: {
              labels: Object.keys(severities),
              datasets: [{
                data: Object.values(severities),
                backgroundColor: Object.keys(severities).map(sev => {
                  if (sev.toLowerCase() === 'high') return '#dc2626';
                  if (sev.toLowerCase() === 'medium') return '#f59e0b';
                  return '#16a34a'; // low
                })
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'top' }
              }
            }
          });
        })
        .catch(err => {
          alert('Could not load dashboard data.');
          console.error(err);
        });

      // Dark mode toggle logic
      const toggle = document.getElementById('darkToggle');
      toggle.addEventListener('change', () => {
        document.body.classList.toggle('dark-mode');
      });
    </script>
  </body>
</html>
