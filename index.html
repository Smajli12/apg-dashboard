<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdPulse Guard Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif']
            },
            colors: {
              darkcard: '#2a2a3b',
              darkbg: '#1e1e2f'
            }
          }
        }
      };
    </script>
    <link rel="icon" href="data:,">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      .tooltip {
        position: relative;
        display: inline-block;
        cursor: help;
      }
      .tooltip .tooltiptext {
        visibility: hidden;
        width: 180px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 5px;
        position: absolute;
        z-index: 1;
        bottom: 125%;
        left: 50%;
        transform: translateX(-50%);
        opacity: 0;
        transition: opacity 0.3s;
      }
      .tooltip:hover .tooltiptext {
        visibility: visible;
        opacity: 1;
      }
      .fade-in {
        animation: fadeIn 0.6s ease-in;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-white font-sans transition-colors duration-300 min-h-screen">
    <div class="max-w-6xl mx-auto py-8 px-4">
      <!-- UI content here -->
    </div>
    <script>
      window.onload = function () {
        const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx-PFUcYyEXUR7Thw8kqzAWpCX74XY-4c-Si9myS69jloI9Vir_5YaZLXGCUiUquxMn/exec';
        const labelMap = {
          gpt_not_loaded: 'GPT not loaded',
          wrong_network: 'Wrong network configuration',
          slot_not_registered: 'DOM slot not in GPT',
          defined_without_dom: 'GPT slot without DOM',
          unexpected_size: 'Unexpected ad size',
          empty_response: 'Empty ad response'
        };

        let issueChart, severityChart, lossTrendChart;

        const dateInput = document.getElementById('dateFilter');
        const clearDate = document.getElementById('clearDate');
        const clientFilter = document.getElementById('clientFilter');
        const darkModeBtn = document.getElementById('darkModeBtn');
        const modeLabel = document.getElementById('modeLabel');

        function updateModeLabel() {
          if (modeLabel) {
            modeLabel.textContent = document.documentElement.classList.contains('dark') ? 'Light Mode' : 'Dark Mode';
          }
        }

        if (localStorage.getItem('theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
        updateModeLabel();

        if (darkModeBtn) {
          darkModeBtn.addEventListener('click', () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateModeLabel();
          });
        }

        fetch(SHEET_URL)
          .then(res => res.json())
          .then(json => {
            const allRows = json.data || [];

            const clientIds = [...new Set(allRows.map(row => row.clientId))];
            clientIds.forEach(id => {
              const opt = document.createElement('option');
              opt.value = id;
              opt.textContent = id;
              clientFilter.appendChild(opt);
            });

            function updateDashboard(rows, selectedDate = null, selectedClient = '') {
              const issueTypes = {}, severities = {}, dailyTotals = {};
              let totalSlots = 0, totalLoss = 0;
              let topSlot = null, topLoss = 0;

              rows.forEach(row => {
                const dateKey = new Date(row.receivedAt).toISOString().split('T')[0];
                if (selectedDate && dateKey !== selectedDate) return;
                if (selectedClient && row.clientId !== selectedClient) return;

                const rawType = row.issueType?.trim() || 'unknown_issue';
                const label = labelMap[rawType] || rawType;
                const severity = row.severity?.trim().toLowerCase() || 'unknown';
                const loss = parseFloat(row.estimatedDailyRevenueRisk) || 0;

                issueTypes[label] = (issueTypes[label] || 0) + 1;
                severities[severity] = (severities[severity] || 0) + 1;
                dailyTotals[dateKey] = (dailyTotals[dateKey] || 0) + loss;

                totalSlots++;
                totalLoss += loss;

                if (loss > topLoss) {
                  topLoss = loss;
                  topSlot = row;
                }
              });

              const title = document.getElementById('dashboardTitle');
              if (title) title.textContent = selectedDate ? `AdPulse Guard – Summary for ${selectedDate}` : 'AdPulse Guard – Overall Summary';

              document.getElementById('issueCount').textContent = Object.keys(issueTypes).length;
              document.getElementById('slotCount').textContent = totalSlots;
              const lossElem = document.getElementById('dailyLoss');
              lossElem.textContent = `$${totalLoss.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
              lossElem.classList.toggle('text-red-600', totalLoss > 3000);
              lossElem.classList.toggle('animate-pulse', totalLoss > 3000);
              if (totalLoss === 0 && selectedDate) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
              }

              const box = document.getElementById('topOffenderBox');
              if (topSlot) {
                box.classList.remove('hidden');
                document.getElementById('offenderSlot').textContent = topSlot.slotId;
                document.getElementById('offenderLoss').textContent = `$${topLoss.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
                document.getElementById('offenderPage').textContent = topSlot.pageUrl;
                document.getElementById('offenderIssue').textContent = labelMap[topSlot.issueType] || topSlot.issueType;
              } else {
                box.classList.add('hidden');
              }

              if (issueChart) issueChart.destroy();
              issueChart = new Chart(document.getElementById('issueChart'), {
                type: 'bar',
                data: {
                  labels: Object.keys(issueTypes),
                  datasets: [{ label: 'Issue Count', data: Object.values(issueTypes), backgroundColor: '#3b82f6' }]
                },
                options: { responsive: true, maintainAspectRatio: false }
              });

              if (severityChart) severityChart.destroy();
              severityChart = new Chart(document.getElementById('severityChart'), {
                type: 'pie',
                data: {
                  labels: Object.keys(severities),
                  datasets: [{
                    data: Object.values(severities),
                    backgroundColor: Object.keys(severities).map(sev => sev === 'high' ? '#dc2626' : sev === 'medium' ? '#f59e0b' : '#16a34a')
                  }]
                },
                options: { responsive: true, maintainAspectRatio: false }
              });

              if (lossTrendChart) lossTrendChart.destroy();
              lossTrendChart = new Chart(document.getElementById('lossTrendChart'), {
                type: 'line',
                data: {
                  labels: Object.keys(dailyTotals).sort(),
                  datasets: [{
                    label: 'Daily Loss ($)',
                    data: Object.keys(dailyTotals).sort().map(d => dailyTotals[d]),
                    borderColor: '#3b82f6',
                    tension: 0.3
                  }]
                },
                options: { responsive: true, maintainAspectRatio: true }
              });

              document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
            }

            dateInput.addEventListener('change', () => updateDashboard(allRows, dateInput.value, clientFilter.value));
            clientFilter.addEventListener('change', () => updateDashboard(allRows, dateInput.value, clientFilter.value));
            clearDate.addEventListener('click', () => {
              dateInput.value = '';
              updateDashboard(allRows, null, clientFilter.value);
            });

            updateDashboard(allRows);
          });
      }
    </script>
  </body>
</html>
