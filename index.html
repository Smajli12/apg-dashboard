<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdPulse Guard Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif']
            },
            colors: {
              darkcard: '#2a2a3b'
            }
          }
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans transition-colors duration-300 min-h-screen">
    <div class="max-w-6xl mx-auto py-8 px-4">
      <div class="flex justify-end mb-4 items-center gap-2">
        <span class="text-sm">🌞</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="darkToggle" class="sr-only peer" />
          <div class="w-11 h-6 bg-gray-300 peer-focus:outline-none rounded-full peer dark:bg-gray-600 peer-checked:bg-blue-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:translate-x-full peer-checked:border-white"></div>
        </label>
        <span class="text-sm">🌙</span>
      </div>

      <h1 class="text-4xl font-extrabold text-center mb-8 tracking-tight dark:text-white">
        AdPulse Guard – Dashboard
      </h1>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-white dark:bg-darkcard text-center rounded-2xl shadow-md p-6 transition hover:shadow-lg">
          <div class="text-3xl font-bold animate-pulse text-gray-900 dark:text-white" id="issueCount">0</div>
          <div class="text-sm text-gray-600 dark:text-gray-300">Issue Types</div>
        </div>
        <div class="bg-white dark:bg-darkcard text-center rounded-2xl shadow-md p-6 transition hover:shadow-lg">
          <div class="text-3xl font-bold text-gray-900 dark:text-white" id="slotCount">0</div>
          <div class="text-sm text-gray-600 dark:text-gray-300">Total Slots</div>
        </div>
        <div class="bg-white dark:bg-darkcard text-center rounded-2xl shadow-md p-6 transition hover:shadow-lg">
          <div class="text-3xl font-bold text-gray-900 dark:text-white" id="dailyLoss">$0.00</div>
          <div class="text-sm text-gray-600 dark:text-gray-300">Daily Loss</div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-md p-4">
          <canvas id="issueChart" class="h-64"></canvas>
        </div>
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-md p-4">
          <canvas id="severityChart" class="h-64"></canvas>
        </div>
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-md p-4 col-span-2">
          <h2 class="text-lg font-semibold mb-2 dark:text-white">Daily Loss Trend</h2>
          <div class="h-64">
            <canvas id="lossTrendChart" class="h-full w-full"></canvas>
          </div>
        </div>
      </div>

      <p class="text-xs text-gray-400 dark:text-gray-500 mt-8 text-right">
        Last updated: <span id="lastUpdated">loading...</span>
      </p>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script type="module">
      import confetti from 'https://cdn.skypack.dev/canvas-confetti';

      const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx-PFUcYyEXUR7Thw8kqzAWpCX74XY-4c-Si9myS69jloI9Vir_5YaZLXGCUiUquxMn/exec';

      const labelMap = {
        gpt_not_loaded: 'GPT not loaded',
        wrong_network: 'Wrong network configuration',
        slot_not_registered: 'DOM slot not in GPT',
        defined_without_dom: 'GPT slot without DOM',
        unexpected_size: 'Unexpected ad size',
        empty_response: 'Empty ad response'
      };

      fetch(SHEET_URL)
        .then(res => res.json())
        .then(json => {
          const rows = json.data || [];

          const issueTypes = {};
          const severities = {};
          const dailyTotals = {};
          let totalSlots = 0;
          let totalLoss = 0;

          rows.forEach(row => {
            const rawType = row.issueType?.trim() || 'unknown_issue';
            const label = labelMap[rawType] || rawType;
            const severity = row.severity?.trim().toLowerCase() || 'unknown';
            const loss = parseFloat(row.estimatedDailyRevenueRisk) || 0;
            const dateKey = new Date(row.receivedAt).toISOString().split('T')[0];

            issueTypes[label] = (issueTypes[label] || 0) + 1;
            severities[severity] = (severities[severity] || 0) + 1;
            dailyTotals[dateKey] = (dailyTotals[dateKey] || 0) + loss;

            totalSlots++;
            totalLoss += loss;
          });

          document.getElementById('issueCount').textContent = Object.keys(issueTypes).length;
          document.getElementById('slotCount').textContent = totalSlots;
          const lossElem = document.getElementById('dailyLoss');
          lossElem.textContent = `$${totalLoss.toFixed(2)}`;
          if (totalLoss > 3000) {
            lossElem.classList.add('text-red-600', 'animate-pulse');
          }
          if (totalLoss === 0) {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }

          document.getElementById('lastUpdated').textContent = new Date().toLocaleString();

          new Chart(document.getElementById('issueChart'), {
            type: 'bar',
            data: {
              labels: Object.keys(issueTypes),
              datasets: [{
                label: 'Issue Count',
                data: Object.values(issueTypes),
                backgroundColor: '#3b82f6'
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { display: false },
                tooltip: {
                  callbacks: {
                    label: (context) => `Count: ${context.parsed.y}`
                  }
                }
              },
              scales: {
                y: { beginAtZero: true }
              }
            }
          });

          new Chart(document.getElementById('severityChart'), {
            type: 'pie',
            data: {
              labels: Object.keys(severities),
              datasets: [{
                data: Object.values(severities),
                backgroundColor: Object.keys(severities).map(sev => {
                  if (sev === 'high') return '#dc2626';
                  if (sev === 'medium') return '#f59e0b';
                  return '#16a34a';
                })
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'top' }
              }
            }
          });

          const trendLabels = Object.keys(dailyTotals).sort();
          const trendData = trendLabels.map(d => dailyTotals[d]);

          new Chart(document.getElementById('lossTrendChart'), {
            type: 'line',
            data: {
              labels: trendLabels,
              datasets: [{
                label: 'Daily Loss ($)',
                data: trendData,
                borderColor: '#3b82f6',
                fill: false,
                tension: 0.3
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: { position: 'top' }
              },
              scales: { y: { beginAtZero: true } }
            }
          });
        });

      const toggle = document.getElementById('darkToggle');
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
        toggle.checked = true;
      }
      toggle.addEventListener('change', () => {
        if (toggle.checked) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme', 'light');
        }
      });
    </script>
  </body>
</html>
