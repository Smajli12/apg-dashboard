<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdPulse Guard Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="max-w-5xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-center mb-8">AdPulse Guard – Dashboard</h1>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 text-center mb-8">
      <div class="bg-white p-6 rounded-2xl shadow">
        <p class="text-2xl font-bold" id="issueTypes">0</p>
        <p class="text-sm text-gray-500">Issue Types</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow">
        <p class="text-2xl font-bold" id="totalSlots">0</p>
        <p class="text-sm text-gray-500">Total Slots</p>
      </div>
      <div class="bg-white p-6 rounded-2xl shadow">
        <p class="text-2xl font-bold" id="dailyLoss">$0.00</p>
        <p class="text-sm text-gray-500">Daily Loss</p>
      </div>
    </div>

    <div class="charts flex flex-wrap justify-center gap-6 mt-6">
      <div class="w-full md:w-[500px] h-[300px] bg-white p-4 rounded-2xl shadow">
        <canvas id="barChart"></canvas>
      </div>
      <div class="w-full md:w-[400px] h-[300px] bg-white p-4 rounded-2xl shadow">
        <canvas id="pieChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx-PFUcYyEXUR7Thw8kqzAWpCX74XY-4c-Si9myS69jloI9Vir_5YaZLXGCUiUquxMn/exec';

    async function fetchData() {
      const res = await fetch(SHEET_URL);
      const { data } = await res.json();

      if (!data) throw new Error('Could not load dashboard data.');

      const issueCounts = {};
      const severityCounts = {};
      const slotSet = new Set();
      let totalLoss = 0;

      data.forEach(row => {
        if (row.issueType) issueCounts[row.issueType] = (issueCounts[row.issueType] || 0) + 1;
        if (row.severity) severityCounts[row.severity.toUpperCase()] = (severityCounts[row.severity.toUpperCase()] || 0) + 1;
        if (row.slotId) slotSet.add(row.slotId);

        const risk = parseFloat(row.estimatedDailyRevenueRisk);
        if (!isNaN(risk)) totalLoss += risk;
      });

      document.getElementById('issueTypes').innerText = Object.keys(issueCounts).length;
      document.getElementById('totalSlots').innerText = slotSet.size;
      document.getElementById('dailyLoss').innerText = `$${totalLoss.toFixed(2)}`;

      new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
          labels: Object.keys(issueCounts),
          datasets: [{
            label: 'Issue Count',
            data: Object.values(issueCounts),
            backgroundColor: '#3b82f6'
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: { y: { beginAtZero: true } }
        }
      });

      new Chart(document.getElementById('pieChart'), {
        type: 'pie',
        data: {
          labels: Object.keys(severityCounts),
          datasets: [{
            data: Object.values(severityCounts),
            backgroundColor: Object.keys(severityCounts).map(s => {
              if (s === 'HIGH') return '#dc2626';
              if (s === 'MEDIUM') return '#f59e0b';
              return '#16a34a';
            })
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: {
                color: '#111'
              }
            }
          }
        }
      });
    }

    fetchData().catch(err => {
      alert(err.message);
    });
  </script>
</body>
</html>
