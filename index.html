<!DOCTYPE html>
<html lang="en" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AdPulse Guard Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif']
            },
            colors: {
              darkcard: '#2a2a3b',
              darkbg: '#1e1e2f'
            }
          }
        }
      };
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-white font-sans transition-colors duration-300 min-h-screen">
    <div class="max-w-6xl mx-auto py-8 px-4">
      <div class="flex justify-between mb-4 items-center gap-4 flex-wrap">
        <div class="flex flex-wrap items-center gap-2">
          <label for="dateFilter" class="text-sm font-medium text-gray-700 dark:text-gray-300">Date:</label>
          <input type="date" id="dateFilter" class="px-2 py-1 border border-gray-300 rounded-md dark:bg-darkcard dark:border-gray-600 dark:text-white" />
          <button id="clearDate" class="text-sm text-blue-600 hover:underline">Clear</button>

          <label for="clientFilter" class="ml-4 text-sm font-medium text-gray-700 dark:text-gray-300">Client:</label>
          <select id="clientFilter" class="px-2 py-1 border border-gray-300 rounded-md dark:bg-darkcard dark:border-gray-600 dark:text-white">
            <option value="">All Clients</option>
          </select>
        </div>
        <button id="darkModeBtn" class="flex items-center gap-2 px-3 py-1 bg-gray-200 dark:bg-gray-700 text-sm rounded-full transition-colors hover:bg-gray-300 dark:hover:bg-gray-600">
          <span class="text-lg">🌓</span>
          <span id="modeLabel">Dark Mode</span>
        </button>
      </div>

      <h1 id="dashboardTitle" class="text-4xl font-extrabold text-center mb-8 tracking-tight">
        AdPulse Guard – Overall Summary
      </h1>

      <div id="topOffenderBox" class="bg-white dark:bg-darkcard text-left rounded-2xl shadow-md p-6 mb-6 hidden">
        <h2 class="text-lg font-semibold mb-2">🚨 Top Offender Slot</h2>
        <p><strong>Slot:</strong> <span id="offenderSlot"></span></p>
        <p><strong>Loss:</strong> <span id="offenderLoss"></span></p>
        <p><strong>Page:</strong> <span id="offenderPage"></span></p>
        <p><strong>Issue:</strong> <span id="offenderIssue"></span></p>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 mb-8">
        <div class="bg-white dark:bg-darkcard text-center rounded-2xl shadow-md p-6">
          <div class="text-3xl font-bold animate-pulse" id="issueCount">0</div>
          <div class="text-sm text-gray-600 dark:text-gray-300">Issue Types</div>
        </div>
        <div class="bg-white dark:bg-darkcard text-center rounded-2xl shadow-md p-6">
          <div class="text-3xl font-bold" id="slotCount">0</div>
          <div class="text-sm text-gray-600 dark:text-gray-300">Total Slots</div>
        </div>
        <div class="bg-white dark:bg-darkcard text-center rounded-2xl shadow-md p-6">
          <div class="text-3xl font-bold text-red-600 animate-pulse" id="dailyLoss">$0.00</div>
          <div class="text-sm text-gray-600 dark:text-gray-300">Daily Loss</div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-md p-4">
          <canvas id="issueChart" class="h-64"></canvas>
        </div>
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-md p-4">
          <canvas id="severityChart" class="h-64"></canvas>
        </div>
        <div class="bg-white dark:bg-darkcard rounded-2xl shadow-md p-4 col-span-2">
          <h2 class="text-lg font-semibold mb-2">Daily Loss Trend</h2>
          <canvas id="lossTrendChart" class="h-64 w-full"></canvas>
        </div>
      </div>

      <p class="text-xs text-gray-400 dark:text-gray-500 mt-8 text-right">
        Last updated: <span id="lastUpdated">loading...</span>
      </p>
    </div>

    <script type="module">
      import confetti from 'https://cdn.skypack.dev/canvas-confetti';
      import Chart from 'https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.js';

      const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx-PFUcYyEXUR7Thw8kqzAWpCX74XY-4c-Si9myS69jloI9Vir_5YaZLXGCUiUquxMn/exec';

      const labelMap = {
        gpt_not_loaded: 'GPT not loaded',
        wrong_network: 'Wrong network configuration',
        slot_not_registered: 'DOM slot not in GPT',
        defined_without_dom: 'GPT slot without DOM',
        unexpected_size: 'Unexpected ad size',
        empty_response: 'Empty ad response'
      };

      let issueChart, severityChart, lossTrendChart;

      const dateInput = document.getElementById('dateFilter');
      const clearDate = document.getElementById('clearDate');
      const clientFilter = document.getElementById('clientFilter');

      fetch(SHEET_URL)
        .then(res => res.json())
        .then(json => {
          const allRows = json.data || [];

          const clientIds = [...new Set(allRows.map(r => r.clientId))];
          clientIds.forEach(id => {
            const opt = document.createElement('option');
            opt.value = id;
            opt.textContent = id;
            clientFilter.appendChild(opt);
          });

          function updateDashboard(rows, selectedDate = null, selectedClient = '') {
            const issueTypes = {}, severities = {}, dailyTotals = {};
            let totalSlots = 0, totalLoss = 0;
            let topSlot = null, topLoss = 0;

            rows.forEach(row => {
              const dateKey = new Date(row.receivedAt).toISOString().split('T')[0];
              if (selectedDate && dateKey !== selectedDate) return;
              if (selectedClient && row.clientId !== selectedClient) return;

              const rawType = row.issueType?.trim() || 'unknown_issue';
              const label = labelMap[rawType] || rawType;
              const severity = row.severity?.trim().toLowerCase() || 'unknown';
              const loss = parseFloat(row.estimatedDailyRevenueRisk) || 0;

              issueTypes[label] = (issueTypes[label] || 0) + 1;
              severities[severity] = (severities[severity] || 0) + 1;
              dailyTotals[dateKey] = (dailyTotals[dateKey] || 0) + loss;

              totalSlots++;
              totalLoss += loss;

              if (loss > topLoss) {
                topLoss = loss;
                topSlot = row;
              }
            });

            document.getElementById('dashboardTitle').textContent =
              selectedDate ? `AdPulse Guard – Summary for ${selectedDate}` : 'AdPulse Guard – Overall Summary';

            document.getElementById('issueCount').textContent = Object.keys(issueTypes).length;
            document.getElementById('slotCount').textContent = totalSlots;
            const lossElem = document.getElementById('dailyLoss');
            lossElem.textContent = `$${totalLoss.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
            lossElem.classList.toggle('text-red-600', totalLoss > 3000);
            lossElem.classList.toggle('animate-pulse', totalLoss > 3000);

            if (totalLoss === 0 && selectedDate) {
              confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }

            const box = document.getElementById('topOffenderBox');
            if (topSlot) {
              box.classList.remove('hidden');
              document.getElementById('offenderSlot').textContent = topSlot.slotId;
              document.getElementById('offenderLoss').textContent = `$${topLoss.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
              document.getElementById('offenderPage').textContent = topSlot.pageUrl;
              document.getElementById('offenderIssue').textContent = labelMap[topSlot.issueType] || topSlot.issueType;
            } else {
              box.classList.add('hidden');
            }

            if (issueChart) issueChart.destroy();
            issueChart = new Chart(document.getElementById('issueChart'), {
              type: 'bar',
              data: {
                labels: Object.keys(issueTypes),
                datasets: [{
                  label: 'Issue Count',
                  data: Object.values(issueTypes),
                  backgroundColor: '#3b82f6'
                }]
              },
              options: { responsive: true, maintainAspectRatio: false }
            });

            if (severityChart) severityChart.destroy();
            severityChart = new Chart(document.getElementById('severityChart'), {
              type: 'pie',
              data: {
                labels: Object.keys(severities),
                datasets: [{
                  data: Object.values(severities),
                  backgroundColor: Object.keys(severities).map(s =>
                    s === 'high' ? '#dc2626' : s === 'medium' ? '#f59e0b' : '#16a34a')
                }]
              },
              options: { responsive: true, maintainAspectRatio: false }
            });

            if (lossTrendChart) lossTrendChart.destroy();
            lossTrendChart = new Chart(document.getElementById('lossTrendChart'), {
              type: 'line',
              data: {
                labels: Object.keys(dailyTotals).sort(),
                datasets: [{
                  label: 'Daily Loss ($)',
                  data: Object.values(dailyTotals),
                  borderColor: '#3b82f6',
                  tension: 0.3
                }]
              },
              options: { responsive: true, maintainAspectRatio: true }
            });

            document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
          }

          dateInput.addEventListener('change', () => {
            updateDashboard(allRows, dateInput.value, clientFilter.value);
          });

          clientFilter.addEventListener('change', () => {
            updateDashboard(allRows, dateInput.value, clientFilter.value);
          });

          clearDate.addEventListener('click', () => {
            dateInput.value = '';
            updateDashboard(allRows, null, clientFilter.value);
          });

          updateDashboard(allRows);
        });

      const darkModeBtn = document.getElementById('darkModeBtn');
      const modeLabel = document.getElementById('modeLabel');

      function updateModeLabel() {
        modeLabel.textContent = document.documentElement.classList.contains('dark') ? 'Light Mode' : 'Dark Mode';
      }

      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.classList.add('dark');
      }
      updateModeLabel();

      darkModeBtn.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
        updateModeLabel();
      });
    </script>
  </body>
</html>
