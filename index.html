<!DOCTYPE html>
<html lang="en" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitoring Alert Dashboard</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            darkcard: '#2a2a3b',
            darkbg: '#1e1e2f'
          }
        }
      }
    };
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>

<body class="bg-gray-50 dark:bg-darkbg text-gray-900 dark:text-white font-sans min-h-screen">

<!-- LOADING OVERLAY (ne blokira UI) -->
<div id="loadingIndicator" class="fixed inset-0 z-40 flex items-center justify-center bg-white/70 dark:bg-darkbg/70 text-gray-500 text-sm">
  <div class="flex flex-col items-center">
    <svg class="animate-spin h-6 w-6 text-blue-500 mb-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
    </svg>
    Loading data…
  </div>
</div>

<div id="dashboardContent" class="max-w-6xl mx-auto py-8 px-4 transition-opacity duration-300">

  <!-- HEADER -->
  <div class="flex justify-between mb-6 items-center gap-4 flex-wrap">
    <h1 id="dashboardTitle" class="text-4xl font-extrabold tracking-tight">
      Monitoring Alert – Overall Summary
    </h1>

    <div class="flex items-center gap-2 text-sm">
      <input type="date" id="dateFilter" class="px-2 py-1 border rounded dark:bg-darkcard" />
      <select id="clientFilter" class="px-2 py-1 border rounded dark:bg-darkcard">
        <option value="">All Clients</option>
      </select>
      <button id="clearDate" class="text-blue-600 hover:underline">Clear</button>
    </div>
  </div>

  <!-- KPI -->
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-6 text-center">
      <div class="text-3xl font-bold" id="issueCount">—</div>
      <div class="text-sm text-gray-500">Issue Types</div>
    </div>
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-6 text-center">
      <div class="text-3xl font-bold" id="slotCount">—</div>
      <div class="text-sm text-gray-500">Total Slots</div>
    </div>
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-6 text-center">
      <div class="text-3xl font-bold text-red-600" id="dailyLoss">$—</div>
      <div class="text-sm text-gray-500">Daily Loss</div>
    </div>
  </div>

  <!-- CHARTS -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-4">
      <canvas id="issueChart" class="h-64"></canvas>
    </div>
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-4">
      <canvas id="severityChart" class="h-64"></canvas>
    </div>
    <div class="bg-white dark:bg-darkcard rounded-xl shadow p-4 md:col-span-2">
      <canvas id="lossTrendChart" class="h-64 w-full"></canvas>
    </div>
  </div>

  <p class="text-xs text-gray-400 mt-6 text-right">
    Last updated: <span id="lastUpdated">—</span>
  </p>
</div>

<script>
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx-PFUcYyEXUR7Thw8kqzAWpCX74XY-4c-Si9myS69jloI9Vir_5YaZLXGCUiUquxMn/exec';
const CACHE_KEY = 'apg_dashboard_cache';
const CACHE_TTL = 5 * 60 * 1000; // 5 min

let issueChart, severityChart, lossTrendChart;

function renderDashboard(rows) {
  const issueTypes = {}, severities = {}, dailyTotals = {};
  let totalSlots = 0, totalLoss = 0;

  rows.forEach(r => {
    issueTypes[r.issueType] = (issueTypes[r.issueType] || 0) + 1;
    severities[r.severity] = (severities[r.severity] || 0) + 1;
    const d = r.receivedAt.split('T')[0];
    dailyTotals[d] = (dailyTotals[d] || 0) + (+r.estimatedDailyRevenueRisk || 0);
    totalSlots++;
    totalLoss += (+r.estimatedDailyRevenueRisk || 0);
  });

  document.getElementById('issueCount').textContent = Object.keys(issueTypes).length;
  document.getElementById('slotCount').textContent = totalSlots;
  document.getElementById('dailyLoss').textContent = `$${totalLoss.toFixed(2)}`;

  if (issueChart) issueChart.destroy();
  issueChart = new Chart(issueChartEl, {
    type: 'bar',
    data: { labels: Object.keys(issueTypes), datasets: [{ data: Object.values(issueTypes), backgroundColor: '#3b82f6' }] },
    options: { maintainAspectRatio: false }
  });

  if (severityChart) severityChart.destroy();
  severityChart = new Chart(severityChartEl, {
    type: 'pie',
    data: { labels: Object.keys(severities), datasets: [{ data: Object.values(severities), backgroundColor: ['#dc2626','#f59e0b','#3b82f6'] }] },
    options: { maintainAspectRatio: false }
  });

  if (lossTrendChart) lossTrendChart.destroy();
  lossTrendChart = new Chart(lossTrendChartEl, {
    type: 'line',
    data: { labels: Object.keys(dailyTotals), datasets: [{ data: Object.values(dailyTotals), borderColor: '#3b82f6', tension: 0.3 }] },
    options: { maintainAspectRatio: false }
  });

  document.getElementById('lastUpdated').textContent = new Date().toLocaleString();
  document.getElementById('loadingIndicator').style.display = 'none';
}

// FAST PATH: cache
const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
if (cached && Date.now() - cached.ts < CACHE_TTL) {
  renderDashboard(cached.data);
}

// ALWAYS refresh in background
fetch(SHEET_URL)
  .then(r => r.json())
  .then(j => {
    const rows = j.data || [];
    localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), data: rows }));
    renderDashboard(rows);
  });
</script>

</body>
</html>
