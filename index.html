<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AdPulse Guard Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f9fafb;
      margin: 0;
      padding: 20px;
      color: #111;
    }
    h1 {
      text-align: center;
      margin-bottom: 24px;
    }
    .metrics {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
      flex-wrap: wrap;
    }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      text-align: center;
      min-width: 180px;
    }
    .card h2 {
      font-size: 28px;
      margin: 0;
      color: #1f2937;
    }
    .card p {
      margin-top: 4px;
      font-size: 14px;
      color: #6b7280;
    }
    .charts {
      display: flex;
      justify-content: center;
      gap: 60px;
      flex-wrap: wrap;
    }
    canvas {
      max-width: 400px;
    }
  </style>
</head>
<body>
  <h1>AdPulse Guard – Dashboard</h1>
  <div class="metrics">
    <div class="card">
      <h2 id="issueTypes">0</h2>
      <p>Issue Types</p>
    </div>
    <div class="card">
      <h2 id="totalSlots">0</h2>
      <p>Total Slots</p>
    </div>
    <div class="card">
      <h2 id="dailyLoss">$0.00</h2>
      <p>Daily Loss</p>
    </div>
  </div>
  <div class="charts">
    <canvas id="barChart"></canvas>
    <canvas id="pieChart"></canvas>
  </div>

  <script>
    const SHEET_URL = 'https://script.google.com/macros/s/AKfycbx-PFUcYyEXUR7Thw8kqzAWpCX74XY-4c-Si9myS69jloI9Vir_5YaZLXGCUiUquxMn/exec';

    async function fetchData() {
      try {
        const res = await fetch(SHEET_URL);
        const json = await res.json();
        return json.data || [];
      } catch (e) {
        console.error('Failed to fetch data', e);
        return [];
      }
    }

    function renderDashboard(data) {
      const issueCounts = {};
      const slotSet = new Set();
      let totalLoss = 0;
      const severityCounts = {};

      data.forEach(row => {
        const type = row.issueType;
        const slot = row.slotId;
        const sev = (row.severity || '').toUpperCase();

        issueCounts[type] = (issueCounts[type] || 0) + 1;
        if (slot) slotSet.add(slot);

        const risk = parseFloat(row.estimatedDailyRevenueRisk);
        if (!isNaN(risk)) totalLoss += risk;

        if (sev) severityCounts[sev] = (severityCounts[sev] || 0) + 1;
      });

      document.getElementById('issueTypes').innerText = Object.keys(issueCounts).length;
      document.getElementById('totalSlots').innerText = slotSet.size;
      document.getElementById('dailyLoss').innerText = `$${totalLoss.toFixed(2)}`;

      // Bar chart
      new Chart(document.getElementById('barChart'), {
        type: 'bar',
        data: {
          labels: Object.keys(issueCounts),
          datasets: [{
            label: 'Record Count',
            data: Object.values(issueCounts),
            backgroundColor: '#3b82f6'
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { autoSkip: false } }
          }
        }
      });

      // Pie chart
      const severityColorMap = {
        HIGH: '#dc2626',
        MEDIUM: '#f59e0b',
        LOW: '#16a34a'
      };

      const severityLabels = Object.keys(severityCounts);
      const severityValues = Object.values(severityCounts);
      const severityColors = severityLabels.map(l => severityColorMap[l] || '#9ca3af');

      new Chart(document.getElementById('pieChart'), {
        type: 'pie',
        data: {
          labels: severityLabels,
          datasets: [{
            data: severityValues,
            backgroundColor: severityColors
          }]
        }
      });
    }

    fetchData().then(renderDashboard);
  </script>
</body>
</html>
